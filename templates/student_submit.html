{% extends "base.html" %}{% block content %}<h1>Submit details for verification</h1><div class="form-card wide"><form method="post"><label>Roll number<input name="roll_no" required></label><label>Department<input name="department" required></label><label>Graduation year<input type="number" name="graduation_year" min="2000" max="2155" required></label><label>Placement eligibility<select name="is_eligible"><option value="yes">Eligible</option><option value="no">Not eligible</option></select></label><label>Skills (comma separated)<textarea name="skills"></textarea></label><label>Placement status<select name="placement_status"><option value="NOT_PLACED">Not placed</option><option value="APPLIED">Applied</option><option value="SELECTED">Selected</option><option value="PLACED">Placed</option></select></label><label>Company (optional)<input name="company"></label><label>Job role (optional)<input name="job_role"></label><label>Package LPA (optional)<input type="number" step="0.01" min="0" name="package_lpa"></label><button>Submit for review</button></form></div>{% endblock %}
