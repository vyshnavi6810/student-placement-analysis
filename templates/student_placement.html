{% extends "base.html" %}{% block content %}<h1>My Placement</h1><div class="panel"><table><tr><th>Company</th><th>Role</th><th>Package (LPA)</th><th>Status</th><th>Date</th></tr>{% for r in rows %}<tr><td>{{r.company}}</td><td>{{r.role}}</td><td>{{r.package_lpa or '—'}}</td><td>{{r.status}}</td><td>{{r.placement_date or '—'}}</td></tr>{% else %}<tr><td colspan="5">No verified placement records yet.</td></tr>{% endfor %}</table></div>{% endblock %}
