{% extends "base.html" %}{% block content %}<div class="form-card"><h1>Student registration</h1><p>{{university}}</p>{% if error %}<p class="notice error">{{error}}</p>{% endif %}<form method="post"><label>Full name<input name="full_name" required></label><label>Email<input type="email" name="email" required></label><label>Username<input name="username" required></label><label>Password (8+ characters)<input type="password" name="password" minlength="8" required></label><button>Create account</button></form><a href="{{url_for('login')}}">Back to login</a></div>{% endblock %}
