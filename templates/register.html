
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Student Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">

    <main class="login-card">
        <section class="login-form-section">
            <div class="login-logo">P</div>

            <p class="eyebrow">STUDENT PLACEMENT ANALYTICS</p>
            <h1>Create account</h1>
            <p class="subtitle">Register to access your student placement portal.</p>

            {% if error %}
    <p class="login-error">{{ error }}</p>
            {% endif %}

{% with messages = get_flashed_messages() %}
    {% for message in messages %}
        <p class="login-error">{{ message }}</p>
    {% endfor %}
{% endwith %}

            <form method="POST" action="{{ url_for('register') }}">
                <label for="full_name">Full name</label>
                <div class="input-wrapper">
                    <input id="full_name" name="full_name"
                           type="text" placeholder="Enter your full name" required>
                </div>

                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input id="email" name="email"
                           type="email" placeholder="Enter your email" required>
                </div>

                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input id="username" name="username"
                           type="text" placeholder="Choose a username"
                           minlength="3" maxlength="50" required>
                </div>

                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input id="password" name="password"
                           type="password" placeholder="Create a password"
                           minlength="8" autocomplete="new-password" required>
                </div>

                <button class="login-button" type="submit">
                    CREATE ACCOUNT →
                </button>
            </form>

            <p class="login-footer">
                Already registered?
                <a href="{{ url_for('login') }}">Sign in</a>
            </p>
        </section>
    </main>

</body>
</html>
